; PublishHub worker test configuration.
;
; `pythonpath = src` puts the package on the import path without an editable
; install, so `make test-worker` is one pip install and one pytest run.
;
; Every test in this suite runs against the in-memory fakes in
; publishhub_worker.queue.testing or the shared JSON contract fixture, so the
; suite needs no Redis, no AWS account, and no network.
[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --strict-markers
