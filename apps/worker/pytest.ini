; PublishHub worker test configuration.
;
; `pythonpath = src` puts the package on the import path without an editable
; install, so `make test-worker` is one pip install and one pytest run.
;
; Every test in this suite runs against the in-memory fakes in
; publishhub_worker.queue.testing, a StringIO log sink, or the shared JSON
; contract fixture, so the suite needs no Redis, no AWS account, and no network.
;
; `-p no:cacheprovider` is deliberately absent: the .pytest_cache directory is
; gitignored and `--lf` is useful locally.
[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --strict-markers
