# PublishHub Helm Chart - Production (EKS/AWS) overrides
# Layer this on top of values.yaml: helm install -f values.yaml -f values-production.yaml

global:
  image:
    # Overridden by CI with the Git commit SHA for immutable deploys
    tag: "latest"

# --- API Service ---
api:
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/publishhub-api
    tag: ""  # uses global.image.tag
  replicaCount: 2
  env:
    NODE_ENV: production
    CORS_ORIGINS: "https://publishhub.example.com"
  rollout:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# --- Worker Service ---
worker:
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/publishhub-worker
    tag: ""  # uses global.image.tag
  replicaCount: 1
  env:
    MAX_ATTEMPTS: "3"
    POLL_WAIT_SECONDS: "20"
    SIMULATE_LATENCY_MS: "0"
    SIMULATE_FAILURE_RATE: "0"
  keda:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 60
    listLength: "10"

# --- Web Frontend ---
web:
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/publishhub-web
    tag: ""  # uses global.image.tag
  replicaCount: 2
  env:
    API_BASE_URL: "/api"

# --- Queue Configuration ---
queue:
  backend: sqs

# --- Redis (still used for post state, but not for the queue) ---
redis:
  enabled: true
  url: "redis://publishhub-redis:6379"

# --- SQS ---
sqs:
  queueUrl: "https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/publishhub-jobs"
  region: "us-east-1"

# --- Observability ---
observability:
  enabled: true
  datadog:
    env: "production"
    service: "publishhub"
    version: ""  # set by CI from Git SHA

# --- Service Account ---
serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/publishhub-irsa"
