# PublishHub Helm Chart - Production (EKS/AWS) overrides
# Layer this on top of values.yaml along with the account-specific overlay:
#   helm install -f values.yaml -f values-production.yaml -f values-account.yaml
#
# Account-specific values (ECR repos, SQS URL, IRSA role ARN) live in
# values-account.yaml which is gitignored. See values-account.yaml.example.

global:
  image:
    # Overridden by CI with the Git commit SHA for immutable deploys
    tag: "1695e04126026be0cb6a87a12232973689fd73a8"
# --- API Service ---
api:
  image:
    repository: "" # set via values-account.yaml
    tag: "" # uses global.image.tag
  replicaCount: 2
  env:
    NODE_ENV: production
    CORS_ORIGINS: "https://publishhub.com"
  rollout:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
# --- Worker Service ---
worker:
  image:
    repository: "" # set via values-account.yaml
    tag: "" # uses global.image.tag
  replicaCount: 1
  env:
    MAX_ATTEMPTS: "3"
    POLL_WAIT_SECONDS: "20"
    SIMULATE_LATENCY_MS: "0"
    SIMULATE_FAILURE_RATE: "0"
  keda:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 60
    listLength: "10"
# --- Web Frontend ---
web:
  image:
    repository: "" # set via values-account.yaml
    tag: "" # uses global.image.tag
  replicaCount: 2
  env:
    API_BASE_URL: "/api"
# --- Queue Configuration ---
queue:
  backend: sqs
# --- Redis (still used for post state, but not for the queue) ---
redis:
  enabled: true
  url: "redis://publishhub-redis:6379"
# --- SQS ---
sqs:
  queueUrl: "" # set via values-account.yaml
  region: "" # set via values-account.yaml
# --- Observability ---
observability:
  enabled: true
  datadog:
    env: "production"
    service: "publishhub"
    version: "1695e04126026be0cb6a87a12232973689fd73a8" # set by CI from Git SHA
# --- Service Account ---
serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: "" # set via values-account.yaml
