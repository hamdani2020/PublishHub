apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "publishhub.componentFullname" (dict "context" . "component" "web") }}
  labels:
    {{- include "publishhub.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "publishhub.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "publishhub.componentLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "publishhub.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: {{ include "publishhub.image" (dict "image" .Values.web.image "tag" .Values.global.image.tag) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: {{ .Values.web.env.API_BASE_URL | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
