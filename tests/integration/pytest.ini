; PublishHub end-to-end integration suite (spec task 6.2).
;
; Separate from apps/worker/pytest.ini on purpose. That suite is hermetic — no
; Redis, no network, no containers — and runs in a second; this one drives a
; docker compose stack and is measured in tens of seconds at best. Keeping them
; apart means `make test-worker` never waits on Docker, and this file's rootdir,
; sys.path, and options are its own.
;
; `testpaths = .` makes this directory the rootdir, so `conftest.py` and
; `stack.py` are importable by the test module without a package or an editable
; install.
;
; The suite registers no "needs Docker" marker: whether the stack can run is
; decided at runtime by probing the daemon, so there is nothing for a caller to
; remember to deselect. Skipping on purpose is PUBLISHHUB_SKIP_INTEGRATION=1.
;
; `-x` because once the stack is proven broken the remaining tests re-prove it
; slowly, and the first failure already carries the recent api and worker logs.
[pytest]
testpaths = .
addopts = -ra -x --strict-markers
