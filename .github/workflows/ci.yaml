name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/publishhub/values-production.yaml"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "CONTRIBUTING.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "CONTRIBUTING.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No elevated permissions needed; images are built locally and never pushed.
permissions:
  contents: read

jobs:
  # API service: lint, typecheck, unit tests
  api:
    name: "API: lint + typecheck + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Web frontend: lint, typecheck, unit tests
  web:
    name: "Web: lint + typecheck + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Worker service: lint, unit tests
  worker:
    name: "Worker: lint + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  # Helm chart: lint and template with each values file
  helm:
    name: "Helm: lint + template"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint (default values)
        run: helm lint helm/publishhub

      - name: Lint (production values)
        run: helm lint helm/publishhub -f helm/publishhub/values-production.yaml

      - name: Template (default values)
        run: helm template publishhub helm/publishhub > /dev/null

      - name: Template (production values)
        run: helm template publishhub helm/publishhub -f helm/publishhub/values-production.yaml > /dev/null

  # Terraform: format check and validate
  terraform:
    name: "Terraform: fmt + validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize (backend disabled)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # Build container images and scan with Trivy
  images:
    name: "Images: build + Trivy scan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: apps/api
            image: publishhub-api
          - service: worker
            context: apps/worker
            image: publishhub-worker
          - service: web
            context: apps/web
            image: publishhub-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
