# ArgoCD Application — publishhub
#
# NOTE: This file is a REFERENCE ONLY. The actual ArgoCD Application resource
# is managed by Terraform (terraform/modules/argocd-app/) which injects
# account-specific Helm parameters (ECR repos, SQS URL, IRSA role ARN)
# at apply time. Do not apply this file manually.
#
# To deploy: run `terraform apply` in the terraform/ directory.
# The Terraform module creates the Application with the correct parameters
# sourced from infrastructure outputs.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publishhub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # References the AppProject that restricts repos, namespaces, and resources
  project: publishhub

  source:
    # --- REPO URL (single configurable location — Requirement 8.7) ---
    repoURL: https://github.com/hamdani2020/PublishHub.git
    targetRevision: HEAD
    path: helm/publishhub
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      # Account-specific values injected at deploy time via ArgoCD.
      # These are NOT stored in git (public repo). Set them using one of:
      #   1. `argocd app set publishhub --helm-set ...`
      #   2. ArgoCD UI → Parameters
      #   3. An ArgoCD secret plugin or AVP (Argo Vault Plugin)
      #
      # Required parameters:
      #   api.image.repository        = <ECR_REGISTRY>/publishhub-api
      #   worker.image.repository     = <ECR_REGISTRY>/publishhub-worker
      #   web.image.repository        = <ECR_REGISTRY>/publishhub-web
      #   sqs.queueUrl                = https://sqs.<REGION>.amazonaws.com/<ACCOUNT>/publishhub-jobs-production
      #   sqs.region                  = <REGION>
      #   serviceAccount.annotations.eks\.amazonaws\.com/role-arn = arn:aws:iam::<ACCOUNT>:role/publishhub-irsa
      parameters: []

  destination:
    server: https://kubernetes.default.svc
    namespace: publishhub

  syncPolicy:
    automated:
      # Prune resources that are no longer in Git (Requirement 8.3)
      prune: true
      # Self-heal: revert manual kubectl edits back to Git state (Requirement 8.5)
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
